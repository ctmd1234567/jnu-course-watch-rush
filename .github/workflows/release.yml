name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read release tag
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm ci

      - name: Verify source
        if: steps.existing.outputs.exists != 'true'
        run: npm run check && npm test

      - name: Build Windows packages
        if: steps.existing.outputs.exists != 'true'
        run: npm run build:win -- --publish never

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @"
          ## 重要说明

          - **研究生选课系统只是尽力兼容且未经研究生账号验证，大概率不可用。** 页面、参数或提交函数不同时会失败。
          - 原选课系统继续作为默认入口；两个系统使用互相独立的登录状态和 adapter。

          ## 0.4.0 更新

          - 将原“新生选课系统”准确改名为“研究生选课系统”，并迁移旧配置。
          - 研究生入口按相似 xsxkapp 框架尽力复用页面识别、搜索、选择确认与抢课预热。
          - 研究生未知页面不再误报人工认证，并可复制严格脱敏的页面与网络诊断。
          - 修复同一课程号结果过多时只检查第一页、找不到后续教学班的问题。
          - 保留原选课系统既有流程，并按当前入口隔离域名、会话与适配器。

          请优先下载安装版。程序不是暨南大学官方产品，使用前请确认学校规则。
          "@
          gh release create $env:RELEASE_TAG `
            "dist/JNU-Course-Watch-Rush-Setup-$env:RELEASE_VERSION-x64.exe" `
            "dist/JNU-Course-Watch-Rush-Portable-$env:RELEASE_VERSION-x64.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "JNU Course Watch & Rush $env:RELEASE_VERSION" `
            --notes $notes `
            --latest

      - name: Remove superseded releases
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($tag in @('v0.2.0', 'v0.3.0')) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) {
              Write-Host "$tag does not exist or was already removed."
            }
          }
          exit 0
